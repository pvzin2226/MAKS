<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - MaK'S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="cadastro">

<header>
    <h1>Aylin&K<sub>s</sub></h1>

    <div class="menu-direita">

        <button class="menu-botao" id="menu-botao">
            ☰
        </button>
    </div>
</header>

<div class="cadastro-caixa">

    <h1>Cadastrar Produto</h1>

    <form id="form-produto">

    <label>Nome do produto:</label>
    <input type="text" id="nome">



    <label>Preço:</label>
    <input type="text" id="preco" value="0,00" inputmode="numeric">



    <label>Descrição:</label>
    <textarea id="descricao"></textarea>



    <label>Imagem:</label>
    <input type="text" id="imagem" placeholder="batom.jpg">


     <label>Estoque:</label>
        <input type="number" id="estoque" min="0" value="0s">



        <button type="submit">Adicionar Produto</button>

    </form>

</div>

<div class="menu-lateral" id="menu-lateral">
    <button class="fechar-menu" id="fechar-menu">

        x

    </button>

    <h2>Mak's</h2>

    <a href="index.html">Inicio</a>
    <a href="produtos.html">Produtos</a>

</div>

<script src="script.js"></script>

</body>

</html>
